<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    MyCards — silhouette de carte et son liseré intérieur.
    Proportions 40 x 56, soit le rapport d'une vraie carte (63 x 88 mm), et
    peu de marge autour : à 16 px chaque pixel perdu en marge compte.
    Le liseré est un évidement (fill-rule evenodd) et non un trait peint en
    couleur de fond : il reste visible sur un onglet clair comme sur un sombre.
  -->
