<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon MyCards : le « D » en réserve fourni par l'utilisateur, aux couleurs
  de la direction « holo » — fond nuit avec son halo violet et cyan, lettre
  dans le dégradé irisé de l'application. Il porte son propre fond, donc il
  reste lisible sur un onglet clair comme sur un onglet sombre.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="halo-violet" cx="0.22" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-cyan" cx="0.88" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#00d6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00d6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="holo" gradientUnits="userSpaceOnUse" x1="70" y1="70" x2="330" y2="330">
      <stop offset="0" stop-color="#7cf5ff"/>
      <stop offset="0.42" stop-color="#a78bfa"/>
      <stop offset="0.72" stop-color="#ffa8e2"/>
      <stop offset="1" stop-color="#ffe58a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="88" fill="#0a0f1f"/>
  <rect width="400" height="400" rx="88" fill="url(#halo-violet)"/>
  <rect width="400" height="400" rx="88" fill="url(#halo-cyan)"/>
  <rect x="3" y="3" width="394" height="394" rx="85" fill="none" stroke="url(#holo)" stroke-opacity="0.45" stroke-width="6"/>
  <!-- Le « D » réduit autour du centre : l'icône respire, la lettre ne touche
       plus presque les bords. -->
  <g transform="translate(200 200) scale(0.78) translate(-200 -200)">
    <path fill="url(#holo)" d="M298.38,110.73c-22.21-28.03-49.73-42.05-82.52-42.05H70.67c7.66,11.38,11.51,24.47,11.51,39.27v183.68c0,6.09-3.84,19.04-11.51,38.88,1.32.27,2.44.46,3.37.59.93.14,1.78.21,2.58.21h29.75c8.52,0,18.03-.07,28.58-.21v-161.89c0-3.84,3.11-6.95,6.95-6.95h109.04c3.84,0,6.95,3.1,6.95,6.95v152.05c14.2-7.22,27.44-18.68,39.73-34.39,21.15-27.5,31.74-56.34,31.74-86.49,0-33.59-10.33-63.48-30.95-89.66ZM241.28,173.57h-89.75c-3.01,0-5.45,2.44-5.45,5.45v148.35c0,1.35.5,2.6,1.32,3.55.21,0,.42-.01.62-.01,15.87-.25,29.76-.39,41.66-.39h29.75c9.45,0,18.54-1.5,27.31-4.53v-146.97c0-3.01-2.44-5.45-5.45-5.45Z"/>
  </g>
</svg>
