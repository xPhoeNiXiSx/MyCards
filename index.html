<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyCards — Hello World</title>
<style>
  :root {
    --bg: #fbfaf8;
    --fg: #191817;
    --muted: #6b6864;
    --accent: #c15f3c;
    --card: #ffffff;
    --border: #e8e4de;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171614;
      --fg: #f2efea;
      --muted: #a39f99;
      --accent: #e08a68;
      --card: #201e1c;
      --border: #332f2b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  h1 { margin: 0 0 8px; font-size: 1.75rem; letter-spacing: -0.02em; }
  p { margin: 0; color: var(--muted); line-height: 1.6; }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    vertical-align: middle;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .875em;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 6px;
  }
  .meta { margin-top: 24px; font-size: .8125rem; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <h1><span class="dot"></span>Hello World</h1>
    <p>Le déploiement de <code>MyCards</code> fonctionne.</p>
    <p class="meta">Page statique servie depuis <code>index.html</code>.</p>
  </main>
</body>
</html>
